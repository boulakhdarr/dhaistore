
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Campaign Tracking</title>
</head>
<body>

<h2>Campaign</h2>
<p>Allow measurement of this campaign interaction?</p>

<button id="continue">Continue</button>
<p id="status"></p>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwxfR8a229fC6Je3q1-qHVDNJDnoPUyTkeqUgteGhrVN-QkMDNqRnASqwolGv1wcAi4SA/exec";

document.getElementById("continue").onclick = function () {

    const params = new URLSearchParams(location.search);
    const email = params.get("email");
    const campaign = params.get("campaign") || "Campaign01";

    if (!email) {
        document.getElementById("status").textContent =
            "Email missing";
        return;
    }

    const url = ENDPOINT +
        "?email=" + encodeURIComponent(email) +
        "&campaign=" + encodeURIComponent(campaign);

    fetch(url, { mode: "no-cors" })
        .then(() => {
            document.getElementById("status").textContent =
                "Request submitted";
        })
        .catch(() => {
            document.getElementById("status").textContent =
                "Request failed";
        });
};
</script>

</body>
</html>
