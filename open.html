
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Tracking</title>
<style>
body {
  font-family: Arial, sans-serif;
  max-width: 450px;
  margin: 60px auto;
  padding: 20px;
  text-align: center;
}
button {
  padding: 12px 30px;
  cursor: pointer;
}
#status {
  margin-top: 20px;
}
</style>
</head>
<body>

<h2>Interaction Tracking</h2>
<p>Do you agree to register this interaction?</p>

<button id="agree">Agree</button>
<p id="status"></p>

<script>
const API = "https://script.google.com/macros/s/AKfycbxInU4ZzIdNnMPhOXZYI5OzeP4o8itjKFcVL5RR20zeZtgZkC3hEPp4C89fuMEzQkTi1Q/exec";

const button = document.getElementById("agree");
const status = document.getElementById("status");

button.addEventListener("click", async function() {

  const params = new URLSearchParams(location.search);

  const email = params.get("email");
  const campaign = params.get("campaign") || "Campaign01";

  if (!email) {
    status.textContent = "Email missing";
    return;
  }

  const url = new URL(API);

  url.searchParams.set("email", email);
  url.searchParams.set("campaign", campaign);
  url.searchParams.set("event", "Open");
  url.searchParams.set("page", location.pathname);

  button.disabled = true;
  status.textContent = "Submitting...";

  try {
    const response = await fetch(url.toString());

    const result = await response.text();

    if (result.trim() === "SUCCESS") {
      status.textContent = "Successfully registered!";
    } else {
      status.textContent = "Server error: " + result;
      button.disabled = false;
    }

  } catch (error) {
    status.textContent = "Connection error: " + error.message;
    button.disabled = false;
  }

});
</script>

</body>
</html>
